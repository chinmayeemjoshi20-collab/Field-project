<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>भारतीय संगीत प्रश्नावली - भाग 4</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Noto Serif Devanagari", "Georgia", serif;
    color: #3d210d;
    padding: 35px 15px;
    position: relative;
    min-height: 100vh;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;

    background-image:
        linear-gradient(
            rgba(55, 25, 8, 0.35),
            rgba(55, 25, 8, 0.55)
        ),
        url("backgroundimg.jpg");

    background-size: cover;
    background-position: center top;
    background-attachment: fixed;
    background-repeat: no-repeat;

    filter: saturate(.82);
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -3;
    background: #3a1807;
}

/* HEADER */

.header {
    text-align: center;

    padding: 35px 20px;
    margin-bottom: 25px;

    background:
        linear-gradient(
            rgba(91, 45, 15, 0.90),
            rgba(58, 27, 8, 0.90)
        );

    border: 2px solid #d6a84f;
    border-radius: 18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.55),
        inset 0 0 30px rgba(255,200,80,.08);
}

.header h1 {
    margin: 0;

    color: #f6d477;

    font-size: 38px;

    text-shadow: 0 2px 5px #000;
}

.header p {
    color: #e8c98a;
    font-size: 17px;
}


/* DECORATION */

.decor {
    width: 75%;
    height: 2px;

    margin: 18px auto;

    background: linear-gradient(
        to right,
        transparent,
        #d8ae59,
        #fff0b0,
        #d8ae59,
        transparent
    );

    position: relative;
}

.decor::after {
    content: "✦";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -55%);

    background: #63310f;

    padding: 0 10px;

    color: #f3d27b;
}


/* SCORE */

.score-box {
    position: sticky;
    top: 12px;

    z-index: 20;

    text-align: center;

    padding: 13px;
    margin-bottom: 25px;

    background: rgba(54,25,7,.95);

    border: 1px solid #d6a84f;

    border-radius: 30px;

    color: #ead095;

    box-shadow: 0 5px 20px rgba(0,0,0,.45);
}

.score-box span {
    color: #ffd86a;

    font-size: 24px;

    font-weight: bold;
}


/* QUESTION */

.question {
    position: relative;

    padding: 25px 27px;

    margin-bottom: 25px;

    background:
        linear-gradient(
            rgba(245,218,159,.95),
            rgba(210,165,91,.95)
        );

    border: 2px solid #a96f25;

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.45),
        inset 0 0 20px rgba(100,45,5,.15);

    overflow: hidden;
}

.question::before {
    content: "❈";

    position: absolute;

    top: 8px;
    right: 12px;

    color: rgba(117,69,20,.35);

    font-size: 24px;
}

.question h3 {
    margin: 0 25px 18px 0;

    color: #4b260d;

    font-size: 19px;

    line-height: 1.6;
}


/* OPTIONS */

.option {
    width: 100%;

    display: block;

    margin: 9px 0;
    padding: 13px 16px;

    border: 1px solid #a87532;
    border-radius: 9px;

    background: rgba(255,245,216,.75);

    color: #42240f;

    text-align: left;

    font-family: inherit;
    font-size: 16px;

    cursor: pointer;

    transition:
        transform .2s,
        background .2s,
        box-shadow .2s;
}

.option:hover:not(:disabled) {
    transform: translateX(5px);

    background: rgba(255,250,230,.95);

    box-shadow:
        0 4px 12px rgba(82,42,8,.25);
}


/* CORRECT */

.option.correct {
    background: #b9d99b !important;

    border-color: #47752b !important;

    color: #234514 !important;

    font-weight: bold;

    box-shadow:
        0 0 12px rgba(63,110,30,.35);
}


/* WRONG */

.option.wrong {
    background: #d9957c !important;

    border-color: #873c28 !important;

    color: #651d0e !important;

    font-weight: bold;
}


/* DISABLED */

.option:disabled {
    cursor: not-allowed;
}


/* FEEDBACK */

.feedback {
    min-height: 25px;

    margin: 15px 0 0;

    font-size: 17px;

    font-weight: bold;
}

.correct-text {
    color: #316d18;
}

.wrong-text {
    color: #8b2412;
}


/* FINAL RESULT */

#finalResult {
    display: none;

    text-align: center;

    margin-top: 35px;
    padding: 35px 20px;

    background:
        linear-gradient(
            rgba(74,35,9,.97),
            rgba(45,20,5,.97)
        );

    border: 2px solid #d6a84f;

    border-radius: 18px;

    color: #f4d68c;

    box-shadow:
        0 10px 35px rgba(0,0,0,.6);
}

#finalResult h2 {
    margin-top: 0;

    color: #f5d476;

    font-size: 31px;
}

.final-score {
    margin: 15px 0;

    color: #ffd968;

    font-size: 48px;

    font-weight: bold;
}

#finalMessage {
    font-size: 18px;
}


/* RESTART */

.restart {
    margin-top: 18px;

    padding: 13px 30px;

    border: 1px solid #e6bd62;

    border-radius: 25px;

    background:
        linear-gradient(
            #e8bd5d,
            #b47a25
        );

    color: #351a07;

    font-family: inherit;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.restart:hover {
    background:
        linear-gradient(
            #f4d278,
            #c58c35
        );
}


/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 18px 10px;
    }

    .header {
        padding: 25px 12px;
    }

    .header h1 {

    }

    .header p {

    }

    .question {
        padding: 20px 17px;
    }

    .question h3 {
        font-size: 17px;
    }

    .option {
        font-size: 15px;
        padding: 12px;
    }
}

</style>
</head>

/* =====================================
   CREATE QUIZ
===================================== */

const quiz = document.getElementById("quiz");

questions.forEach((question, index) => {

    const card = document.createElement("div");

    card.className = "question";

    card.innerHTML = `

        <h3>
            ${index + 1}. ${question.q}
        </h3>

        ${question.options.map((option, i) => `

            <button
                class="option"
                onclick="checkAnswer(
                    this,
                    ${i},
                    ${question.answer}
                )">

                ${String.fromCharCode(97 + i)}) ${option}

            </button>

        `).join("")}

        <p class="feedback"></p>
    `;

    quiz.appendChild(card);
});


/* =====================================
   SCORE
===================================== */

let score = 0;
let answered = 0;


/* =====================================
   CHECK ANSWER
===================================== */

function checkAnswer(button, selected, correct) {

    const questionCard =
        button.parentElement;

    if (questionCard.dataset.answered === "true") {
        return;
    }

    questionCard.dataset.answered = "true";


    const buttons =
        questionCard.querySelectorAll(".option");

    const feedback =
        questionCard.querySelector(".feedback");


    /* Disable all buttons */

    buttons.forEach(btn => {
        btn.disabled = true;
    });


    /* CORRECT ANSWER */

    if (selected === correct) {

        button.classList.add("correct");

        feedback.innerHTML =
            "✅ सही उत्तर! बहुत बढ़िया!";

        feedback.classList.add(
            "correct-text"
        );

        score++;

    }


    /* WRONG ANSWER */

    else {

        button.classList.add("wrong");

        buttons[correct].classList.add(
            "correct"
        );

        feedback.innerHTML =
            "❌ गलत उत्तर! सही उत्तर हरे रंग में है।";

        feedback.classList.add(
            "wrong-text"
        );

    }


    /* UPDATE SCORE */

    document.getElementById("score")
        .innerText = score;


    answered++;


    /* ALL QUESTIONS ANSWERED */

    if (answered === questions.length) {

        setTimeout(showResult, 700);

    }

}


/* =====================================
   SHOW FINAL RESULT
===================================== */

function showResult() {

    const result =
        document.getElementById(
            "finalResult"
        );

    const finalScore =
        document.getElementById(
            "finalScore"
        );

    const finalMessage =
        document.getElementById(
            "finalMessage"
        );


    finalScore.innerText = score;


    if (score === 30) {

        finalMessage.innerHTML =
            "🔥 <b>अद्भुत!</b><br>" +
            "Perfect Score! भारतीय संगीत पर आपकी पकड़ शानदार है।";

    }

    else if (score >= 27) {

        finalMessage.innerHTML =
            "🏆 <b>Excellent!</b><br>" +
            "आपकी तैयारी लगभग Perfect है।";

    }

    else if (score >= 24) {

        finalMessage.innerHTML =
            "👏 <b>बहुत बढ़िया!</b><br>" +
            "बस थोड़ा सा revision और करें।";

    }

    else if (score >= 18) {

        finalMessage.innerHTML =
            "🎵 <b>अच्छा प्रयास!</b><br>" +
            "कुछ important topics फिर से revise करें।";

    }

    else {

        finalMessage.innerHTML =
            "🪔 <b>कोई बात नहीं!</b><br>" +
            "Topics revise करें और फिर से कोशिश करें।";

    }


    result.style.display = "block";


    result.scrollIntoView({
        behavior: "smooth"
    });

}

</script>
