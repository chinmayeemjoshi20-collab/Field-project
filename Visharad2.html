let score = 0;
let answered = 0;

document.getElementById("total").textContent = questions.length;


function loadQuiz() {

    const quiz = document.getElementById("quiz");

    questions.forEach((question, index) => {

        const card = document.createElement("div");

        card.className = "question";

        let html = `
            <h3>
                ${index + 1}. ${question.q}
            </h3>
        `;

        question.options.forEach((option, optionIndex) => {

            html += `
                <button
                    class="option"
                    onclick="checkAnswer(this, ${index}, ${optionIndex})"
                >
                    ${String.fromCharCode(97 + optionIndex)}) ${option}
                </button>
            `;

        });

        html += `
            <div class="feedback" id="feedback-${index}"></div>
        `;

        card.innerHTML = html;

        quiz.appendChild(card);

    });

}


function checkAnswer(button, questionIndex, selectedIndex) {

    const question = questions[questionIndex];

    const card = button.parentElement;

    const buttons = card.querySelectorAll(".option");

    const feedback =
        document.getElementById(`feedback-${questionIndex}`);


    /* Prevent multiple answers */

    buttons.forEach(btn => {
        btn.disabled = true;
    });


    /* CORRECT */

    if (selectedIndex === question.answer) {

        button.classList.add("correct");

        feedback.textContent =
            "✅ सही उत्तर! बहुत बढ़िया!";

        feedback.style.color = "#216b21";

        score++;

        document.getElementById("score").textContent = score;

    }


    /* WRONG */

    else {

        button.classList.add("wrong");

        buttons[question.answer].classList.add("correct");

        feedback.innerHTML =
            `❌ गलत उत्तर! सही उत्तर है:
            <b>${String.fromCharCode(97 + question.answer)})
            ${question.options[question.answer]}</b>`;

        feedback.style.color = "#9b281d";

    }


    answered++;


    /* COMPLETE */

    if (answered === questions.length) {

        setTimeout(showResult, 500);

    }

}


function showResult() {

    const result =
        document.getElementById("result");

    const finalScore =
        document.getElementById("finalScore");

    const message =
        document.getElementById("message");


    finalScore.textContent =
        `आपका स्कोर: ${score} / ${questions.length}`;


    const percentage =
        (score / questions.length) * 100;


    if (percentage === 100) {

        message.textContent =
            "🏆 Perfect Score! Classical Music Master!";

    }

    else if (percentage >= 90) {

        message.textContent =
            "🔥 Excellent! आपकी तैयारी बहुत मजबूत है!";

    }

    else if (percentage >= 75) {

        message.textContent =
            "👏 बहुत अच्छा! थोड़ी और revision करें।";

    }

    else if (percentage >= 50) {

        message.textContent =
            "🎵 अच्छा प्रयास! Important concepts दोबारा revise करें।";

    }

    else {

        message.textContent =
