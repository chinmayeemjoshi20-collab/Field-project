<head>
<meta charset="UTF-8">

<title>प्रश्नावली पूर्ण विशारद प्रथम </title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;

    background:
    url("file:///C:/Users/Admin/Desktop/VSCODE/FP/backgroundimg.jpg");; center top/cover fixed no-repeat;
  filter:saturate(.82);

        url("music-theme.jpg");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: #3b2414;
    padding: 20px;
}

/* HEADER */

.header {
    max-width: 1000px;
    margin: auto;
    padding: 25px;

    text-align: center;

    background: linear-gradient(135deg, #3a1f0d, #5b3217);

    border: 2px solid #d4af37;
    border-radius: 18px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.45);
}

.header h1 {
    margin: 0;

    color: #f5d76e;

    font-size: 30px;
}

.header p {
    color: #f4e5bd;
    margin-top: 8px;
}


/* SCORE */

.score-box {
    max-width: 1000px;

    margin: 15px auto;

    padding: 14px;

    text-align: center;

    background: rgba(58, 31, 13, 0.95);

    color: #f5d76e;

    border: 2px solid #d4af37;
    border-radius: 12px;

    font-size: 20px;
    font-weight: bold;

    position: sticky;
    top: 10px;

    z-index: 10;

    box-shadow: 0 5px 15px rgba(0,0,0,0.4);
}


/* QUIZ */

#quiz {
    max-width: 1000px;
    margin: auto;
}


/* QUESTION CARD */

.question {
    margin: 20px 0;

    padding: 22px;

    background:
        linear-gradient(
            rgba(255,248,225,0.95),
            rgba(245,225,180,0.95)
        );

    border: 2px solid #a87532;

    border-radius: 16px;

    box-shadow: 0 7px 18px rgba(0,0,0,0.35);
}

.question h3 {
    margin-top: 0;

    color: #542d13;

    font-size: 19px;
}


/* OPTIONS */

.option {
    display: block;

    width: 100%;

    margin: 10px 0;

    padding: 13px 16px;

    text-align: left;

    font-size: 16px;

    color: #3b2414;

    background: #fffaf0;

    border: 2px solid #b88a52;

    border-radius: 10px;

    cursor: pointer;

    transition: 0.2s;
}

.option:hover {
    background: #f3dfb5;

    transform: translateX(4px);
}


/* CORRECT */

.option.correct {
    background: #b8dfb8 !important;

    border-color: #347a34 !important;

    color: #164d16 !important;

    font-weight: bold;
}


/* WRONG */

.option.wrong {
    background: #edb5a8 !important;

    border-color: #a63c2f !important;

    color: #701c14 !important;

    font-weight: bold;
}


/* DISABLED */

.option:disabled {
    cursor: default;
}


/* FEEDBACK */

.feedback {
    margin-top: 12px;

    padding: 10px;

    font-size: 17px;

    font-weight: bold;

    border-radius: 8px;
}


/* FINAL RESULT */

#result {
    max-width: 1000px;

    margin: 30px auto;

    padding: 30px;

    text-align: center;

    background: rgba(58, 31, 13, 0.95);

    color: #f5d76e;

    border: 2px solid #d4af37;

    border-radius: 18px;

    box-shadow: 0 8px 25px rgba(0,0,0,0.5);

    display: none;
}


/* RESTART BUTTON */

.restart {
    margin-top: 15px;

    padding: 12px 25px;

    background: #d4af37;

    color: #3a1f0d;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

.restart:hover {
    background: #f0cf58;
}

</style>
</head>

let score = 0;
let answered = 0;

document.getElementById("total").textContent = questions.length;


function loadQuiz() {

    const quiz = document.getElementById("quiz");

    questions.forEach((question, index) => {

        const card = document.createElement("div");

        card.className = "question";

        let html = `
            <h3>
                ${index + 1}. ${question.q}
            </h3>
        `;


        question.options.forEach((option, optionIndex) => {

            html += `
                <button
                    class="option"
                    onclick="checkAnswer(
                        this,
                        ${index},
                        ${optionIndex}
                    )"
                >
                    ${String.fromCharCode(97 + optionIndex)}) ${option}
                </button>
            `;

        });


        html += `
            <div
                class="feedback"
                id="feedback-${index}">
            </div>
        `;


        card.innerHTML = html;

        quiz.appendChild(card);

    });

}


function checkAnswer(button, questionIndex, selectedIndex) {

    const question = questions[questionIndex];

    const card = button.parentElement;

    const buttons = card.querySelectorAll(".option");

    const feedback =
        document.getElementById(
            `feedback-${questionIndex}`
        );


    /* Prevent answering twice */

    buttons.forEach(btn => {

        btn.disabled = true;

    });


    /* CORRECT ANSWER */

    if (selectedIndex === question.answer) {

        button.classList.add("correct");

        feedback.textContent =
            "✅ सही उत्तर! बहुत बढ़िया!";

        feedback.style.color = "#216b21";

        score++;

        document.getElementById("score").textContent = score;

    }


    /* WRONG ANSWER */

    else {

        button.classList.add("wrong");

        buttons[question.answer].classList.add("correct");

        feedback.innerHTML =
            `❌ गलत उत्तर! सही उत्तर है: 
             <b>${String.fromCharCode(97 + question.answer)}) 
             ${question.options[question.answer]}</b>`;

        feedback.style.color = "#9b281d";

    }


    answered++;


    /* QUIZ COMPLETE */

    if (answered === questions.length) {

        setTimeout(showResult, 500);

    }

}


function showResult() {

    const result =
        document.getElementById("result");

    const finalScore =
        document.getElementById("finalScore");

    const message =
        document.getElementById("message");


    finalScore.textContent =
        `आपका स्कोर: ${score} / ${questions.length}`;


    const percentage =
        (score / questions.length) * 100;


    if (percentage === 100) {

        message.textContent =
            "🏆 Perfect Score! Classical Music Master!";

    }

    else if (percentage >= 90) {

        message.textContent =
            "🔥 Excellent! आपकी तैयारी बहुत मजबूत है!";

    }

    else if (percentage >= 75) {

        message.textContent =
            "👏 बहुत अच्छा! थोड़ी और revision करें।";

    }

    else if (percentage >= 50) {

        message.textContent =
            "🎵 अच्छा प्रयास! Important concepts दोबारा revise करें।";

    }

    else {

        message.textContent =
            "📚 कोई बात नहीं! Concepts revise करके फिर कोशिश करें।";

    }


    result.style.display = "block";

    result.scrollIntoView({
        behavior: "smooth"
    });

}


loadQuiz();

</script>

</html>
