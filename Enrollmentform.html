<!DOCTYPE html>
<html>
<head>
    <title>Uthan Tabla Academy - Enrollment</title>

    <style>
        body {
            margin: 0;
            background-color: #1b0d07;
            background-image: url("backgroundimg.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #120906;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #f5a142;
            font-family: Georgia, serif;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .form {
            width: 70%;
            margin: 40px auto;
            padding: 30px;
            background-color: #24150e;
            border: 1px solid #765039;
            border-radius: 15px;
        }

        h2 {
            text-align: center;
            color: #f5a142;
            font-family: Georgia, serif;
            font-size: 35px;
        }

        p {
            text-align: center;
            color: #ddd;
        }

        label {
            display: block;
            margin-top: 15px;
            color: #f5a142;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            background-color: #302018;
            color: white;
            border: 1px solid #765039;
            border-radius: 7px;
        }

        textarea {
            height: 80px;
        }

        button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 35px;
            background-color: #f28b2c;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            background-color: #120906;
            text-align: center;
            padding: 20px;
            color: #bbb;
        }
    </style>
</head>

<body>

    <header>
        <h1>UTHAN TABLA ACADEMY</h1>

        <nav>
            <a href="Homepage.html">Home</a>
            <a href="#">About</a>
            <a href="Quiz.html">Courses</a>

            <a href="#">Feedback</a>
        </nav>
    </header>

    <div class="form">

        <h2>Enrollment Form</h2>

        <p>Join Uthan Tabla Academy and begin your musical journey.</p>

        <form>

            <label>Student Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email Address</label>
            <input type="email" placeholder="Enter your email">

            <label>Contact Number</label>
            <input type="text" placeholder="Enter your contact number">

            <label>Course</label>
            <select>
                <option>Select your course</option>
<option>Tabla</option>
<option>Beginner Tabla</option>
<option>Intermediate Tabla</option>
<option>Advanced Tabla</option>
<option>Prarambhik</option>
<option>Praveshika Pratham</option>
<option>Praveshika Purna</option>
<option>Madhyama Pratham</option>
<option>Madhyama Purna</option>
<option>Visharad Pratham</option>
<option>Visharad Purna</option>
<option>Alankar Pratham</option>

            </select>

            <label>Time preference</label>
            <select>
                <option>Select your time preference</option>
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
            </select>
            <label>Mode of learning</label>
            <select>
                <option>Select your mode of learning</option>
                <option>Offline</option>
                <option>Online</option>
            
            </select>

            <label>Education Level</label>
            <select>
                <option>Select your education level</option>
                <option>School</option>
                <option>College</option>
                <option>Other</option>
            </select>

            <label>Previous Experience</label>
            <select>
                <option>Select your experience</option>
                <option>No experience</option>
                <option>Less than 1 year</option>
                <option>1 - 3 years</option>
                <option>More than 3 years</option>
            </select>

            <label>Your Goals</label>
            <textarea placeholder="Tell us about your goals"></textarea>

            <label>Address</label>
            <textarea placeholder="Enter your address"></textarea>

            <p>
                <input type="checkbox">
                I agree to the terms and conditions.
            </p>

            <button type="submit">Submit Enrollment</button>

        </form>

    </div>

    <footer>
        Uthan Tabla Academy | © 2026 All Rights Reserved
    </footer>

</body>
</html>
